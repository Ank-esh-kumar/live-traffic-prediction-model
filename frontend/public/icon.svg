<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Signal rings -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.15"/>
  <circle cx="256" cy="240" r="120" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.25"/>
  <circle cx="256" cy="240" r="80" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.35"/>
  <!-- Road -->
  <g filter="url(#glow)">
    <path d="M160 380 L220 160 L256 140 L292 160 L352 380 Z" fill="none" stroke="url(#road)" stroke-width="4" stroke-linejoin="round"/>
    <!-- Center line -->
    <line x1="256" y1="160" x2="256" y2="370" stroke="#22c55e" stroke-width="3" stroke-dasharray="12 8"/>
    <!-- Left lane marking -->
    <line x1="210" y1="200" x2="196" y2="360" stroke="#22c55e" stroke-width="2" opacity="0.5"/>
    <!-- Right lane marking -->
    <line x1="302" y1="200" x2="316" y2="360" stroke="#22c55e" stroke-width="2" opacity="0.5"/>
  </g>
  <!-- Location pin -->
  <g transform="translate(256, 120)" filter="url(#glow)">
    <circle cx="0" cy="0" r="12" fill="#22c55e"/>
    <circle cx="0" cy="0" r="5" fill="#0f172a"/>
  </g>
  <!-- Text -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#e2e8f0">SMART TRAFFIC</text>
</svg>
